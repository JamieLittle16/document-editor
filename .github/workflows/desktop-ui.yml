name: desktop-ui

on:
  push:
    paths: &desktop_paths
      - "presentation/slint-desktop/**"
      - "crates/app-core/**"
      - "crates/document-session/**"
      - "crates/document-engine-api/**"
      - "crates/document-engine-mock/**"
      - "crates/document-protocol/**"
      - "Cargo.toml"
      - ".github/workflows/desktop-ui.yml"
  pull_request:
    paths: *desktop_paths

permissions:
  contents: read

jobs:
  desktop-cross-platform:
    name: desktop-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: presentation/slint-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt,clippy
      - name: Install Linux UI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libfontconfig1-dev
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Check
        run: cargo check --all-targets
      - name: Test
        run: cargo test --all-targets
      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --all-targets -- -D warnings

  desktop-linux-native-smoke:
    name: desktop-linux-native-smoke
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: presentation/slint-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - name: Install Linux native-window dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libfontconfig1-dev \
            libxkbcommon-x11-0 \
            xvfb
      - name: Open authoritative editor window
        run: |
          set -o pipefail
          xvfb-run -a env \
            OFFICE_DESKTOP_SMOKE=1 \
            SLINT_BACKEND=winit-software \
            cargo run --quiet | tee /tmp/office-desktop.log
          grep -Fx 'office_desktop_shell=ready' /tmp/office-desktop.log
          grep -Fx 'office_desktop_text_bytes=21' /tmp/office-desktop.log
          grep -Fx 'office_desktop_status=Authority 1 · Revision 1 · 21 bytes' /tmp/office-desktop.log
