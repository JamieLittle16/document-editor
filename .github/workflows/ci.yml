name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt,clippy
      - name: Architecture
        run: python3 tools/architecture_guard.py
      - name: Compatibility harness unit tests
        run: python3 -m unittest tools.compatibility.test_compatibility
      - name: Format
        run: cargo fmt --all --check
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  libreofficekit-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install LibreOfficeKit qualification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            g++ \
            libreoffice-dev \
            libreofficekit-dev \
            libreoffice-core-nogui \
            libreoffice-writer-nogui
      - name: Generate supplemental native qualification fixtures
        run: |
          python3 spikes/libreofficekit-probe/make_duplicate_fixture.py /tmp/document-editor-lok-duplicate.docx
          mkdir -p /tmp/document-editor-callback-profile
          mkdir -p /tmp/document-editor-render-profile
      - name: Build LibreOfficeKit boundary probes
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic \
            spikes/libreofficekit-probe/probe.cxx \
            -ldl \
            -o /tmp/document-editor-lok-probe
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic \
            spikes/libreofficekit-probe/render_transfer_probe.cxx \
            -ldl \
            -o /tmp/document-editor-render-transfer-probe
      - name: Generate pinned UNO SDK headers for native semantic qualification
        run: |
          rm -rf /tmp/document-editor-uno-generated
          mkdir -p /tmp/document-editor-uno-generated
          /usr/lib/libreoffice/sdk/bin/cppumaker \
            -Gc \
            -O/tmp/document-editor-uno-generated \
            /usr/lib/libreoffice/program/types.rdb \
            /usr/lib/libreoffice/program/types/offapi.rdb
      - name: Build unloadable Writer semantic module and LibreOfficeKit adapter
        id: native-build
        run: |
          set -o pipefail
          # The version-pinned semantic compatibility module owns every UNO and
          # libmergedlo dependency. It is dlopen'd only after LibreOfficeKit starts
          # and dlclose'd with the document semantic view before LOK teardown.
          {
            g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -fPIC -shared \
              -DSAL_UNX \
              -I/usr/include/libreoffice \
              -I/usr/include/x86_64-linux-gnu/libreoffice \
              -I/tmp/document-editor-uno-generated \
              spikes/libreofficekit-process-adapter/writer_semantics_24_2.cxx \
              -L/usr/lib/libreoffice/program \
              -L/usr/lib/libreoffice/sdk/lib \
              -Wl,-rpath,/usr/lib/libreoffice/program \
              -Wl,-rpath,/usr/lib/libreoffice/sdk/lib \
              -Wl,-z,defs \
              -lmergedlo \
              -luno_cppuhelpergcc3 \
              -luno_cppu \
              -luno_salhelpergcc3 \
              -luno_sal \
              -ldl \
              -o /tmp/libdocument-editor-writer-semantics-24-2.so

            g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic \
              -I/usr/include/libreoffice \
              spikes/libreofficekit-process-adapter/adapter.cxx \
              spikes/libreofficekit-process-adapter/writer_semantics_proxy.cxx \
              -ldl \
              -o /tmp/document-editor-lok-process-adapter

            g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic \
              -I/usr/include/libreoffice \
              spikes/libreofficekit-process-adapter/invalidation_revision_probe.cxx \
              spikes/libreofficekit-process-adapter/writer_semantics_proxy.cxx \
              -pthread \
              -ldl \
              -o /tmp/document-editor-invalidation-revision-probe
          } 2>&1 | tee /tmp/document-editor-native-build.log
      - name: Retain native adapter compiler diagnostics on failure
        if: failure() && steps.native-build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: native-adapter-build-log
          path: /tmp/document-editor-native-build.log
          if-no-files-found: error
          retention-days: 7
      - name: Run normalized Writer compatibility fixtures
        run: |
          python3 -m tools.compatibility.runner \
            --manifest compatibility/fixtures.json \
            --probe /tmp/document-editor-lok-probe \
            --install-path /usr/lib/libreoffice/program \
            --profile-root /tmp/document-editor-compatibility-profiles \
            --artifact-root /tmp/document-editor-compatibility
      - name: Qualify real Writer render-transfer workload
        run: |
          set -o pipefail
          python3 spikes/libreofficekit-probe/render_transfer_contract.py \
            /tmp/document-editor-render-transfer-probe \
            /usr/lib/libreoffice/program \
            file:///tmp/document-editor-render-profile \
            /tmp/document-editor-compatibility/writer-basic-text-prefix-roundtrip/input.docx \
            | tee /tmp/document-editor-render-transfer.log
      - name: Measure identity-specific package evidence across compatibility round-trip
        run: |
          python3 spikes/libreofficekit-probe/semantic_identity.py \
            /tmp/document-editor-compatibility/writer-basic-text-prefix-roundtrip/input.docx \
            /tmp/document-editor-compatibility/writer-basic-text-prefix-roundtrip/roundtrip.docx
      - name: Qualify real-engine lifecycle, semantics and structural identity
        run: |
          R0A_WRITER_SEMANTICS_MODULE=/tmp/libdocument-editor-writer-semantics-24-2.so \
            python3 spikes/libreofficekit-process-adapter/structural_identity_contract.py \
              /tmp/document-editor-lok-process-adapter \
              /usr/lib/libreoffice/program \
              /tmp/document-editor-compatibility/writer-basic-text-prefix-roundtrip/input.docx
      - name: Qualify paragraph insertion and deletion identity
        run: |
          R0A_WRITER_SEMANTICS_MODULE=/tmp/libdocument-editor-writer-semantics-24-2.so \
            python3 spikes/libreofficekit-process-adapter/paragraph_insert_delete_contract.py \
              /tmp/document-editor-lok-process-adapter \
              /usr/lib/libreoffice/program \
              /tmp/document-editor-compatibility/writer-basic-text-prefix-roundtrip/input.docx
      - name: Qualify formatting-only paragraph identity
        run: |
          R0A_WRITER_SEMANTICS_MODULE=/tmp/libdocument-editor-writer-semantics-24-2.so \
            python3 spikes/libreofficekit-process-adapter/paragraph_format_identity_contract.py \
              /tmp/document-editor-lok-process-adapter \
              /usr/lib/libreoffice/program \
              /tmp/document-editor-compatibility/writer-basic-text-prefix-roundtrip/input.docx
      - name: Qualify duplicate-text paragraph ambiguity
        run: |
          R0A_WRITER_SEMANTICS_MODULE=/tmp/libdocument-editor-writer-semantics-24-2.so \
            python3 spikes/libreofficekit-process-adapter/duplicate_text_identity_contract.py \
              /tmp/document-editor-lok-process-adapter \
              /usr/lib/libreoffice/program \
              /tmp/document-editor-lok-duplicate.docx
      - name: Qualify identity-token scope across reopen and worker restart
        run: |
          R0A_WRITER_SEMANTICS_MODULE=/tmp/libdocument-editor-writer-semantics-24-2.so \
            python3 spikes/libreofficekit-process-adapter/identity_scope_restart_contract.py \
              /tmp/document-editor-lok-process-adapter \
              /usr/lib/libreoffice/program \
              /tmp/document-editor-lok-duplicate.docx
      - name: Qualify invalidation callback safety against semantic revision
        run: |
          R0A_WRITER_SEMANTICS_MODULE=/tmp/libdocument-editor-writer-semantics-24-2.so \
            python3 spikes/libreofficekit-process-adapter/invalidation_revision_contract.py \
              /tmp/document-editor-invalidation-revision-probe \
              /usr/lib/libreoffice/program \
              file:///tmp/document-editor-callback-profile \
              /tmp/document-editor-compatibility/writer-basic-text-prefix-roundtrip/input.docx
      - name: Retain qualification artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-artifacts
          path: |
            /tmp/document-editor-compatibility
            /tmp/document-editor-render-transfer.log
          if-no-files-found: warn
          retention-days: 7
