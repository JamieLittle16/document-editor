name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt,clippy
      - name: Architecture
        run: python3 tools/architecture_guard.py
      - name: Format
        run: cargo fmt --all --check
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  libreofficekit-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install LibreOfficeKit qualification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            g++ \
            libreoffice-dev \
            libreofficekit-dev \
            libreoffice-core-nogui \
            libreoffice-writer-nogui
      - name: Generate deterministic DOCX fixture
        run: |
          python3 spikes/libreofficekit-probe/make_fixture.py /tmp/document-editor-lok-input.docx
          mkdir -p /tmp/document-editor-lok-profile
          mkdir -p /tmp/document-editor-move-profile
      - name: Build LibreOfficeKit boundary probe
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic \
            spikes/libreofficekit-probe/probe.cxx \
            -ldl \
            -o /tmp/document-editor-lok-probe
      - name: Run LibreOfficeKit boundary probe
        run: |
          /tmp/document-editor-lok-probe \
            /usr/lib/libreoffice/program \
            file:///tmp/document-editor-lok-profile \
            /tmp/document-editor-lok-input.docx \
            /tmp/document-editor-lok-roundtrip.docx
      - name: Validate round-trip package and persisted edit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          from zipfile import ZipFile

          path = Path('/tmp/document-editor-lok-roundtrip.docx')
          marker = 'R0A_EDIT_MARKER_7F3D'
          if not path.is_file() or path.stat().st_size == 0:
              raise SystemExit('round-trip DOCX is missing or empty')
          with ZipFile(path) as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise SystemExit(f'corrupt round-trip member: {bad}')
              if 'word/document.xml' not in archive.namelist():
                  raise SystemExit('round-trip DOCX has no word/document.xml')
              root = ElementTree.fromstring(archive.read('word/document.xml'))
              text = ''.join(
                  node.text or ''
                  for node in root.iter(
                      '{http://schemas.openxmlformats.org/wordprocessingml/2006/main}t'
                  )
              )
              if marker not in text:
                  raise SystemExit('LibreOfficeKit edit marker did not persist into DOCX text')
          print(f'roundtrip_bytes={path.stat().st_size}')
          print('persisted_edit=ok')
          PY
      - name: Measure semantic paragraph identity across edit and round-trip
        run: |
          python3 spikes/libreofficekit-probe/semantic_identity.py \
            /tmp/document-editor-lok-input.docx \
            /tmp/document-editor-lok-roundtrip.docx
      - name: Generate pinned UNO SDK headers for native semantic qualification
        run: |
          rm -rf /tmp/document-editor-uno-generated
          mkdir -p /tmp/document-editor-uno-generated
          /usr/lib/libreoffice/sdk/bin/cppumaker \
            -Gc \
            -O/tmp/document-editor-uno-generated \
            /usr/lib/libreoffice/program/types.rdb \
            /usr/lib/libreoffice/program/types/offapi.rdb
      - name: Build unloadable Writer semantic module and LibreOfficeKit adapter
        run: |
          set -o pipefail
          # The version-pinned semantic compatibility module owns every UNO and
          # libmergedlo dependency. It is dlopen'd only after LibreOfficeKit starts
          # and dlclose'd with the document semantic view before LOK teardown.
          {
            g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -fPIC -shared \
              -DSAL_UNX \
              -I/usr/include/libreoffice \
              -I/usr/include/x86_64-linux-gnu/libreoffice \
              -I/usr/lib/libreoffice/sdk/include \
              -I/tmp/document-editor-uno-generated \
              spikes/libreofficekit-process-adapter/writer_semantics_24_2.cxx \
              spikes/libreofficekit-process-adapter/writer_move_qualification_24_2.cxx \
              -L/usr/lib/libreoffice/program \
              -L/usr/lib/libreoffice/sdk/lib \
              -Wl,-rpath,/usr/lib/libreoffice/program \
              -Wl,-rpath,/usr/lib/libreoffice/sdk/lib \
              -Wl,-z,defs \
              -lmergedlo \
              -luno_cppuhelpergcc3 \
              -luno_cppu \
              -luno_salhelpergcc3 \
              -luno_sal \
              -ldl \
              -o /tmp/libdocument-editor-writer-semantics-24-2.so

            g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic \
              -I/usr/include/libreoffice \
              spikes/libreofficekit-process-adapter/adapter.cxx \
              spikes/libreofficekit-process-adapter/writer_semantics_proxy.cxx \
              -ldl \
              -o /tmp/document-editor-lok-process-adapter

            g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic \
              -I/usr/include/libreoffice \
              spikes/libreofficekit-process-adapter/paragraph_move_identity_native_probe.cxx \
              spikes/libreofficekit-process-adapter/writer_semantics_proxy.cxx \
              -ldl \
              -o /tmp/document-editor-paragraph-move-identity-probe
          } 2>&1 | tee /tmp/document-editor-native-build.log
      - name: Retain native adapter compiler diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-adapter-build-log
          path: /tmp/document-editor-native-build.log
          if-no-files-found: error
          retention-days: 7
      - name: Qualify real-engine lifecycle, semantics and structural identity
        run: |
          R0A_WRITER_SEMANTICS_MODULE=/tmp/libdocument-editor-writer-semantics-24-2.so \
            python3 spikes/libreofficekit-process-adapter/structural_identity_contract.py \
              /tmp/document-editor-lok-process-adapter \
              /usr/lib/libreoffice/program \
              /tmp/document-editor-lok-input.docx
      - name: Qualify paragraph insertion and deletion identity
        run: |
          R0A_WRITER_SEMANTICS_MODULE=/tmp/libdocument-editor-writer-semantics-24-2.so \
            python3 spikes/libreofficekit-process-adapter/paragraph_insert_delete_contract.py \
              /tmp/document-editor-lok-process-adapter \
              /usr/lib/libreoffice/program \
              /tmp/document-editor-lok-input.docx
      - name: Qualify formatting-only paragraph identity
        run: |
          R0A_WRITER_SEMANTICS_MODULE=/tmp/libdocument-editor-writer-semantics-24-2.so \
            python3 spikes/libreofficekit-process-adapter/paragraph_format_identity_contract.py \
              /tmp/document-editor-lok-process-adapter \
              /usr/lib/libreoffice/program \
              /tmp/document-editor-lok-input.docx
      - name: Observe Writer-native paragraph move identity
        run: |
          timeout --signal=KILL 20s env \
            R0A_WRITER_SEMANTICS_MODULE=/tmp/libdocument-editor-writer-semantics-24-2.so \
            /tmp/document-editor-paragraph-move-identity-probe \
              /usr/lib/libreoffice/program \
              file:///tmp/document-editor-move-profile \
              /tmp/document-editor-lok-input.docx
