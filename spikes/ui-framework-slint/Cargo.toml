[package]
name = "ui-framework-slint-qualification"
version = "0.0.0"
edition = "2024"
rust-version = "1.92"
publish = false

[dependencies]
slint = { version = "=1.17.1", default-features = false, features = [
  "std",
  "backend-winit",
  "renderer-software",
  "accessibility",
  "compat-1-2",
] }

[workspace]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
