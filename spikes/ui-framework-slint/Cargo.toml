[package]
name = "ui-framework-slint-qualification"
version = "0.0.0"
edition = "2024"
rust-version = "1.92"
publish = false

[dependencies]
slint = { version = "=1.17.1", default-features = false, features = [
  "std",
  "backend-winit",
  "renderer-software",
  "accessibility",
  "compat-1-2",
] }

[workspace]

# Slint's generated `slint!` output contains its own scoped
# `allow(unsafe_code)`. Rust deliberately prevents that from overriding
# `forbid`, even though this qualification crate itself contains no authored
# unsafe blocks. Keep product crates at `forbid`; this isolated candidate
# crate uses `deny` so generated framework internals can compile while any
# unsafe code authored by Office remains an error.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
