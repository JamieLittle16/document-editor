[workspace]
resolver = "2"
members = [
  "apps/desktop",
  "crates/app-core",
  "crates/document-protocol",
  "crates/document-engine-api",
  "crates/document-session",
  "crates/document-engine-mock",
  "workers/document-worker",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
